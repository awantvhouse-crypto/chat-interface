<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WhatsApp Chat Simulator</title>
<link rel="icon" href="whatsapp.png">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#d9dbd5;
  color:#111;
  height:100vh;
  overflow:hidden;
}

body.dark{
  background:#111b21;
  color:#e9edef;
}

.app{
  width:100%;
  height:100vh;
  display:grid;
  grid-template-columns:280px 1fr 280px;
}

/* ================= LEFT / RIGHT PANELS ================= */

.side{
  background:#f0f2f5;
  border-right:1px solid #d1d7db;
  display:flex;
  flex-direction:column;
}

.right{
  border-right:none;
  border-left:1px solid #d1d7db;
}

.dark .side{
  background:#202c33;
  border-color:#374045;
}

.profile{
  height:72px;
  background:#075e54;
  color:white;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 14px;
}

.profile img{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:white;
}

.profile-info{
  flex:1;
}

.profile-info strong{
  display:block;
  font-size:16px;
}

.profile-info small{
  opacity:.85;
}

.composer-title{
  padding:14px;
  font-size:13px;
  font-weight:bold;
  color:#667781;
}

.dark .composer-title{
  color:#aebac1;
}

.composer{
  margin:0 12px 12px;
  background:white;
  border-radius:10px;
  padding:10px;
  box-shadow:0 1px 3px #0002;
}

.dark .composer{
  background:#111b21;
}

textarea{
  width:100%;
  height:90px;
  border:1px solid #ddd;
  border-radius:8px;
  padding:10px;
  resize:none;
  outline:none;
  font-size:14px;
  background:white;
  color:#111;
}

.dark textarea{
  background:#202c33;
  color:#e9edef;
  border-color:#374045;
}

.send-row{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.send-btn{
  flex:1;
  border:none;
  border-radius:8px;
  background:#25d366;
  color:white;
  padding:10px;
  font-weight:bold;
  cursor:pointer;
}

.send-btn:hover{
  background:#20bd5c;
}

.emoji-btn{
  width:42px;
  border:none;
  border-radius:8px;
  background:#e9edef;
  cursor:pointer;
  font-size:20px;
}

.dark .emoji-btn{
  background:#374045;
  color:white;
}

.side-buttons{
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:7px;
  margin-top:auto;
}

.side-buttons button{
  border:none;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  background:#e9edef;
  text-align:left;
}

.dark .side-buttons button{
  background:#374045;
  color:#e9edef;
}

/* ================= CENTER ================= */

.chat{
  display:flex;
  flex-direction:column;
  min-width:0;
  background:#efeae2;
}

.dark .chat{
  background:#0b141a;
}

.chat-header{
  height:72px;
  background:#075e54;
  color:white;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 18px;
}

.chat-header img{
  width:48px;
  height:48px;
  border-radius:50%;
  background:white;
}

.chat-user{
  flex:1;
}

.chat-user strong{
  display:block;
  font-size:17px;
}

.chat-user small{
  opacity:.85;
}

.header-actions{
  display:flex;
  gap:7px;
}

.header-actions button{
  width:38px;
  height:38px;
  border:none;
  border-radius:50%;
  cursor:pointer;
  background:#ffffff20;
  color:white;
  font-size:18px;
}

.search-box{
  display:none;
  padding:8px;
  background:#f0f2f5;
}

.search-box.show{
  display:block;
}

.search-box input{
  width:100%;
  padding:9px 12px;
  border:1px solid #ddd;
  border-radius:20px;
  outline:none;
}

.dark .search-box{
  background:#202c33;
}

.dark .search-box input{
  background:#111b21;
  color:white;
  border-color:#374045;
}

/* ================= MESSAGES ================= */

.messages{
  flex:1;
  overflow-y:auto;
  padding:22px 6%;
  background-image:
    radial-gradient(#00000008 1px,transparent 1px);
  background-size:18px 18px;
}

.dark .messages{
  background-image:
    radial-gradient(#ffffff08 1px,transparent 1px);
}

.empty{
  text-align:center;
  margin-top:80px;
  color:#667781;
}

.dark .empty{
  color:#8696a0;
}

.message-row{
  display:flex;
  margin-bottom:8px;
}

.message-row.me{
  justify-content:flex-start;
}

.message-row.uzair{
  justify-content:flex-end;
}

.message{
  max-width:70%;
  padding:8px 10px 6px;
  border-radius:8px;
  position:relative;
  box-shadow:0 1px 1px #0002;
}

.me .message{
  background:#d9fdd3;
  border-top-left-radius:2px;
}

.uzair .message{
  background:#ffffff;
  border-top-right-radius:2px;
}

.dark .uzair .message{
  background:#202c33;
}

.dark .me .message{
  background:#005c4b;
  color:#e9edef;
}

.message-name{
  font-size:12px;
  font-weight:bold;
  color:#075e54;
  margin-bottom:3px;
}

.dark .message-name{
  color:#53bdeb;
}

.message-text{
  white-space:pre-wrap;
  word-break:break-word;
  font-size:14px;
  line-height:1.45;
}

.message-meta{
  font-size:10px;
  color:#667781;
  text-align:right;
  margin-top:4px;
}

.dark .message-meta{
  color:#aebac1;
}

.message-tools{
  display:none;
  position:absolute;
  right:3px;
  top:-31px;
  background:white;
  border-radius:7px;
  box-shadow:0 2px 8px #0003;
  padding:4px;
  gap:2px;
}

.message:hover .message-tools{
  display:flex;
}

.message-tools button{
  border:none;
  background:none;
  padding:5px;
  cursor:pointer;
  border-radius:5px;
}

.message-tools button:hover{
  background:#eee;
}

.dark .message-tools{
  background:#202c33;
}

.dark .message-tools button{
  color:white;
}

.starred{
  color:#eab308;
}

/* ================= CENTER FOOTER ================= */

.chat-footer{
  background:#f0f2f5;
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:8px;
}

.dark .chat-footer{
  background:#202c33;
}

.chat-footer button{
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  cursor:pointer;
  font-size:20px;
  background:transparent;
}

.center-input{
  flex:1;
  height:44px;
  border:none;
  border-radius:22px;
  padding:0 16px;
  outline:none;
  background:white;
}

.dark .center-input{
  background:#111b21;
  color:white;
}

.center-send{
  background:#25d366 !important;
  color:white;
}

/* ================= EMOJI ================= */

.emoji-panel{
  position:absolute;
  bottom:70px;
  left:10px;
  width:300px;
  max-height:230px;
  overflow:auto;
  background:white;
  border-radius:10px;
  box-shadow:0 3px 15px #0004;
  padding:10px;
  display:none;
  z-index:20;
}

.emoji-panel.show{
  display:block;
}

.dark .emoji-panel{
  background:#202c33;
}

.emoji{
  display:inline-block;
  font-size:25px;
  padding:5px;
  cursor:pointer;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:#222;
  color:white;
  padding:11px 18px;
  border-radius:8px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:100;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  background:#0007;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:420px;
  max-width:92%;
  background:white;
  border-radius:12px;
  overflow:hidden;
}

.dark .modal-box{
  background:#202c33;
  color:white;
}

.modal-head{
  padding:15px;
  background:#075e54;
  color:white;
  display:flex;
  justify-content:space-between;
}

.modal-head button{
  border:none;
  background:none;
  color:white;
  font-size:22px;
  cursor:pointer;
}

.modal-body{
  padding:15px;
}

.setting{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:13px 0;
  border-bottom:1px solid #ddd;
}

.dark .setting{
  border-color:#374045;
}

.setting button{
  border:none;
  padding:8px 12px;
  border-radius:7px;
  cursor:pointer;
  background:#25d366;
  color:white;
}

/* ================= CONTEXT MENU ================= */

.context{
  position:fixed;
  display:none;
  background:white;
  box-shadow:0 3px 15px #0004;
  border-radius:8px;
  overflow:hidden;
  z-index:100;
}

.context.show{
  display:block;
}

.context button{
  display:block;
  width:160px;
  padding:10px 13px;
  border:none;
  background:white;
  text-align:left;
  cursor:pointer;
}

.context button:hover{
  background:#eee;
}

.dark .context{
  background:#202c33;
}

.dark .context button{
  background:#202c33;
  color:white;
}

.dark .context button:hover{
  background:#374045;
}

/* ================= RESPONSIVE ================= */

@media(max-width:900px){
  .app{
    grid-template-columns:220px 1fr 220px;
  }

  .message{
    max-width:82%;
  }
}

@media(max-width:700px){
  body{
    overflow:auto;
  }

  .app{
    height:auto;
    min-height:100vh;
    grid-template-columns:1fr;
  }

  .side{
    display:none;
  }

  .chat{
    height:100vh;
  }

  .chat-footer{
    position:relative;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- ================= YOU ================= -->
  <aside class="side">

    <div class="profile">
      <img src="whatsapp.png" alt="You">
      <div class="profile-info">
        <strong>YOU</strong>
        <small>Your Profile</small>
      </div>
    </div>

    <div class="composer-title">
      SEND MESSAGE AS YOU
    </div>

    <div class="composer">

      <textarea
        id="youInput"
        placeholder="Type your message..."
      ></textarea>

      <div class="send-row">
        <button class="emoji-btn" onclick="toggleEmoji('youEmoji')">😊</button>
        <button class="send-btn" onclick="sendMessage('me')">
          SEND
        </button>
      </div>

    </div>

    <div id="youEmoji" class="emoji-panel"></div>

    <div class="side-buttons">
      <button onclick="openSettings()">⚙️ Settings</button>
      <button onclick="exportChat()">⬇️ Export Chat</button>
      <button onclick="clearChat()">🗑️ Clear Chat</button>
    </div>

  </aside>


  <!-- ================= CENTER CHAT ================= -->
  <main class="chat">

    <header class="chat-header">

      <img src="whatsapp.png" alt="Uzair">

      <div class="chat-user">
        <strong>Uzair</strong>
        <small id="status">online</small>
      </div>

      <div class="header-actions">
        <button onclick="toggleSearch()">🔍</button>
        <button onclick="openSettings()">⋮</button>
      </div>

    </header>

    <div id="searchBox" class="search-box">
      <input
        id="searchInput"
        type="text"
        placeholder="Search messages..."
        oninput="renderMessages()"
      >
    </div>


    <section id="messages" class="messages">
    </section>


    <footer class="chat-footer">

      <button onclick="toggleEmoji('centerEmoji')">😊</button>

      <button onclick="document.getElementById('fileInput').click()">
        📎
      </button>

      <input
        type="file"
        id="fileInput"
        hidden
        onchange="attachFile(event)"
      >

      <input
        id="centerInput"
        class="center-input"
        placeholder="Type a message..."
        autocomplete="off"
      >

      <button
        class="center-send"
        onclick="sendMessage('me')"
      >
        ➤
      </button>

    </footer>

    <div id="centerEmoji" class="emoji-panel"></div>

  </main>


  <!-- ================= UZAIR ================= -->
  <aside class="side right">

    <div class="profile">
      <img src="whatsapp.png" alt="Uzair">
      <div class="profile-info">
        <strong>UZAIR</strong>
        <small>Contact</small>
      </div>
    </div>

    <div class="composer-title">
      SEND MESSAGE AS UZAIR
    </div>

    <div class="composer">

      <textarea
        id="uzairInput"
        placeholder="Type Uzair's message..."
      ></textarea>

      <div class="send-row">
        <button class="emoji-btn" onclick="toggleEmoji('uzairEmoji')">😊</button>

        <button
          class="send-btn"
          onclick="sendMessage('uzair')"
        >
          SEND
        </button>
      </div>

    </div>

    <div id="uzairEmoji" class="emoji-panel"></div>

    <div class="side-buttons">
      <button onclick="showProfile('YOU')">👤 Your Profile</button>
      <button onclick="showProfile('UZAIR')">👤 Uzair Profile</button>
      <button onclick="toggleDark()">🌙 Dark Mode</button>
    </div>

  </aside>

</div>


<!-- ================= TOAST ================= -->

<div id="toast" class="toast"></div>


<!-- ================= CONTEXT MENU ================= -->

<div id="contextMenu" class="context">

  <button onclick="replyMessage()">↩️ Reply</button>
  <button onclick="editMessage()">✏️ Edit</button>
  <button onclick="copyMessage()">📋 Copy</button>
  <button onclick="toggleStar()">⭐ Star</button>
  <button onclick="deleteMessage()">🗑️ Delete</button>

</div>


<!-- ================= SETTINGS ================= -->

<div id="settingsModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">
      <strong>Settings</strong>
      <button onclick="closeSettings()">×</button>
    </div>

    <div class="modal-body">

      <div class="setting">
        <span>Dark Mode</span>
        <button onclick="toggleDark()">Toggle</button>
      </div>

      <div class="setting">
        <span>Chat Sounds</span>
        <button onclick="toggleSound()" id="soundBtn">
          ON
        </button>
      </div>

      <div class="setting">
        <span>Notifications</span>
        <button onclick="showToast('Notifications are local only')">
          INFO
        </button>
      </div>

      <div class="setting">
        <span>Privacy / Local Storage</span>
        <button onclick="showStorageInfo()">
          INFO
        </button>
      </div>

      <div class="setting">
        <span>Export Chat</span>
        <button onclick="exportChat()">
          EXPORT
        </button>
      </div>

      <div class="setting">
        <span>Clear Chat</span>
        <button onclick="clearChat()">
          CLEAR
        </button>
      </div>

    </div>

  </div>

</div>


<script>

/* =========================================================
   LOCAL CHAT DATABASE
   ========================================================= */

const STORAGE_KEY = "two_person_whatsapp_chat_v1";

let messages = [];

let selectedMessageId = null;

let soundEnabled = true;


/* =========================================================
   LOAD
   ========================================================= */

function loadMessages(){

  try{

    const saved = localStorage.getItem(STORAGE_KEY);

    if(saved){
      messages = JSON.parse(saved);
    }

  }catch(error){

    console.log("Could not load messages", error);

    messages = [];

  }

}


/* =========================================================
   SAVE
   ========================================================= */

function saveMessages(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(messages)
    );

  }catch(error){

    console.log("Could not save messages", error);

  }

}


/* =========================================================
   CREATE ID
   ========================================================= */

function createId(){

  return Date.now().toString() +
    Math.random().toString(36).substring(2);

}


/* =========================================================
   SEND MESSAGE
   ========================================================= */

function sendMessage(sender){

  let input;

  if(sender === "me"){

    input = document.getElementById("youInput");

    /* Center input can also send as YOU */
    const centerInput =
      document.getElementById("centerInput");

    if(
      (!input.value.trim()) &&
      centerInput.value.trim()
    ){
      input = centerInput;
    }

  }else{

    input = document.getElementById("uzairInput");

  }


  const text = input.value.trim();

  if(!text){

    showToast("Type a message first");

    input.focus();

    return;

  }


  const message = {

    id:createId(),

    sender:sender,

    text:text,

    time:new Date().toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    ),

    timestamp:Date.now(),

    starred:false

  };


  messages.push(message);

  saveMessages();

  input.value = "";

  const centerInput =
    document.getElementById("centerInput");

  if(sender === "me"){
    centerInput.value = "";
  }


  renderMessages();

  playSound();

  scrollToBottom();

}


/* =========================================================
   RENDER
   ========================================================= */

function renderMessages(){

  const container =
    document.getElementById("messages");

  const search =
    document.getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  let list = messages;

  if(search){

    list = messages.filter(message =>
      message.text.toLowerCase().includes(search)
    );

  }


  if(list.length === 0){

    container.innerHTML = `
      <div class="empty">
        <div style="font-size:42px">💬</div>
        <h3>No messages yet</h3>
        <p>Send a message from YOU or UZAIR.</p>
      </div>
    `;

    return;

  }


  container.innerHTML = "";


  list.forEach(message => {

    const row =
      document.createElement("div");

    row.className =
      "message-row " +
      (message.sender === "me"
        ? "me"
        : "uzair");


    const bubble =
      document.createElement("div");

    bubble.className = "message";


    const name =
      document.createElement("div");

    name.className = "message-name";

    name.textContent =
      message.sender === "me"
        ? "YOU"
        : "UZAIR";


    const text =
      document.createElement("div");

    text.className = "message-text";

    text.textContent = message.text;


    const meta =
      document.createElement("div");

    meta.className = "message-meta";

    meta.textContent =
      message.time +
      (message.starred ? "  ⭐" : "");


    const tools =
      document.createElement("div");

    tools.className = "message-tools";


    const reply =
      document.createElement("button");

    reply.textContent = "↩";

    reply.title = "Reply";

    reply.onclick = () =>
      selectMessage(message.id, "reply");


    const edit =
      document.createElement("button");

    edit.textContent = "✏";

    edit.title = "Edit";

    edit.onclick = () =>
      selectMessage(message.id, "edit");


    const copy =
      document.createElement("button");

    copy.textContent = "📋";

    copy.title = "Copy";

    copy.onclick = () =>
      selectMessage(message.id, "copy");


    const star =
      document.createElement("button");

    star.textContent =
      message.starred ? "★" : "☆";

    star.title = "Star";

    star.onclick = () =>
      selectMessage(message.id, "star");


    const del =
      document.createElement("button");

    del.textContent = "🗑";

    del.title = "Delete";

    del.onclick = () =>
      selectMessage(message.id, "delete");


    tools.appendChild(reply);
    tools.appendChild(edit);
    tools.appendChild(copy);
    tools.appendChild(star);
    tools.appendChild(del);


    bubble.appendChild(tools);
    bubble.appendChild(name);
    bubble.appendChild(text);
    bubble.appendChild(meta);


    row.appendChild(bubble);

    row.addEventListener(
      "contextmenu",
      function(event){

        event.preventDefault();

        selectedMessageId = message.id;

        showContextMenu(
          event.clientX,
          event.clientY
        );

      }
    );


    container.appendChild(row);

  });


  scrollToBottom();

}


/* =========================================================
   SCROLL
   ========================================================= */

function scrollToBottom(){

  const box =
    document.getElementById("messages");

  setTimeout(() => {

    box.scrollTop = box.scrollHeight;

  },30);

}


/* =========================================================
   SEARCH
   ========================================================= */

function toggleSearch(){

  const box =
    document.getElementById("searchBox");

  box.classList.toggle("show");

  if(box.classList.contains("show")){

    document
      .getElementById("searchInput")
      .focus();

  }

}


/* =========================================================
   EMOJI
   ========================================================= */

const emojiList = [

  "😀","😃","😄","😁","😆","😅",
  "😂","🤣","😊","😇","🙂","🙃",
  "😉","😌","😍","🥰","😘","😗",
  "😙","😚","😋","😛","😝","😜",
  "🤪","🤨","🧐","🤓","😎","🤩",
  "🥳","😏","😒","😞","😔","😟",
  "😕","🙁","☹️","😣","😖","😫",
  "😩","🥺","😢","😭","😤","😠",
  "😡","🤬","🤯","😳","🥵","🥶",
  "😱","😨","😰","😥","😓","🤗",
  "🤔","🤭","🤫","🤥","😶","😐",
  "😑","😬","🙄","😯","😦","😧",
  "😮","😲","🥱","😴","🤤","😪",
  "😵","🤐","🥴","🤢","🤮","🤧",
  "😷","🤒","🤕","🤑","🤠","👍",
  "👎","👏","🙌","🙏","❤️","🧡",
  "💛","💚","💙","💜","🖤","🤍",
  "💯","🔥","✨","🎉","💀","👀",
  "💔","💖","💗","💓","💘","💝"

];


function buildEmojiPanel(id){

  const panel =
    document.getElementById(id);

  panel.innerHTML = "";

  emojiList.forEach(emoji => {

    const span =
      document.createElement("span");

    span.className = "emoji";

    span.textContent = emoji;

    span.onclick = () =>
      insertEmoji(id, emoji);

    panel.appendChild(span);

  });

}


function toggleEmoji(id){

  const panel =
    document.getElementById(id);

  document
    .querySelectorAll(".emoji-panel")
    .forEach(p => {

      if(p.id !== id){
        p.classList.remove("show");
      }

    });

  panel.classList.toggle("show");

}


function insertEmoji(panelId, emoji){

  let input;

  if(panelId === "youEmoji"){

    input =
      document.getElementById("youInput");

  }else if(panelId === "uzairEmoji"){

    input =
      document.getElementById("uzairInput");

  }else{

    input =
      document.getElementById("centerInput");

  }


  input.value += emoji;

  input.focus();

}


/* =========================================================
   FILE ATTACHMENT
   ========================================================= */

function attachFile(event){

  const file =
    event.target.files[0];

  if(!file) return;


  if(file.size > 2 * 1024 * 1024){

    showToast("File must be smaller than 2 MB");

    event.target.value = "";

    return;

  }


  const reader =
    new FileReader();


  reader.onload = function(){

    const message = {

      id:createId(),

      sender:"me",

      text:"📎 " + file.name,

      fileName:file.name,

      fileType:file.type,

      fileData:reader.result,

      time:new Date().toLocaleTimeString(
        [],
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      ),

      timestamp:Date.now(),

      starred:false

    };


    messages.push(message);

    saveMessages();

    renderMessages();

    scrollToBottom();

    showToast("Attachment added");

  };


  reader.readAsDataURL(file);

  event.target.value = "";

}


/* =========================================================
   CONTEXT MENU
   ========================================================= */

function showContextMenu(x,y){

  const menu =
    document.getElementById("contextMenu");

  menu.style.left =
    Math.min(x,window.innerWidth - 170) + "px";

  menu.style.top =
    Math.min(y,window.innerHeight - 220) + "px";

  menu.classList.add("show");

}


document.addEventListener("click", function(event){

  const menu =
    document.getElementById("contextMenu");

  if(!menu.contains(event.target)){

    menu.classList.remove("show");

  }

});


function selectMessage(id,action){

  selectedMessageId = id;

  document
    .getElementById("contextMenu")
    .classList.remove("show");


  if(action === "reply"){
    replyMessage();
  }

  if(action === "edit"){
    editMessage();
  }

  if(action === "copy"){
    copyMessage();
  }

  if(action === "star"){
    toggleStar();
  }

  if(action === "delete"){
    deleteMessage();
  }

}


function getSelectedMessage(){

  return messages.find(
    message => message.id === selectedMessageId
  );

}


/* =========================================================
   REPLY
   ========================================================= */

function replyMessage(){

  const message =
    getSelectedMessage();

  if(!message) return;

  const input =
    document.getElementById("centerInput");

  input.value =
    "↩ " +
    (message.sender === "me"
      ? "YOU"
      : "UZAIR") +
    ": " +
    message.text +
    "\n";

  input.focus();

}


/* =========================================================
   EDIT
   ========================================================= */

function editMessage(){

  const message =
    getSelectedMessage();

  if(!message) return;


  const newText =
    prompt(
      "Edit message:",
      message.text
    );


  if(newText === null) return;

  if(!newText.trim()) return;


  message.text =
    newText.trim();

  saveMessages();

  renderMessages();

}


/* =========================================================
   COPY
   ========================================================= */

async function copyMessage(){

  const message =
    getSelectedMessage();

  if(!message) return;


  try{

    await navigator.clipboard.writeText(
      message.text
    );

    showToast("Message copied");

  }catch{

    showToast("Copy is not available");

  }

}


/* =========================================================
   STAR
   ========================================================= */

function toggleStar(){

  const message =
    getSelectedMessage();

  if(!message) return;


  message.starred =
    !message.starred;

  saveMessages();

  renderMessages();

}


/* =========================================================
   DELETE
   ========================================================= */

function deleteMessage(){

  const message =
    getSelectedMessage();

  if(!message) return;


  if(!confirm("Delete this message?")) return;


  messages =
    messages.filter(
      item => item.id !== message.id
    );


  saveMessages();

  renderMessages();

}


/* =========================================================
   DARK MODE
   ========================================================= */

function toggleDark(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "chat_dark_mode",
    document.body.classList.contains("dark")
      ? "1"
      : "0"
  );

}


/* =========================================================
   SOUND
   ========================================================= */

function playSound(){

  if(!soundEnabled) return;


  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext) return;


    const audio =
      new AudioContext();

    const oscillator =
      audio.createOscillator();

    const gain =
      audio.createGain();


    oscillator.frequency.value = 700;

    gain.gain.value = 0.04;


    oscillator.connect(gain);

    gain.connect(audio.destination);


    oscillator.start();

    oscillator.stop(
      audio.currentTime + 0.08
    );

  }catch{

    /* Ignore audio errors */

  }

}


function toggleSound(){

  soundEnabled =
    !soundEnabled;

  document.getElementById(
    "soundBtn"
  ).textContent =
    soundEnabled ? "ON" : "OFF";

}


/* =========================================================
   SETTINGS
   ========================================================= */

function openSettings(){

  document
    .getElementById("settingsModal")
    .classList.add("show");

}


function closeSettings(){

  document
    .getElementById("settingsModal")
    .classList.remove("show");

}


function showStorageInfo(){

  showToast(
    "Messages are stored only in this browser."
  );

}


function showProfile(name){

  showToast(
    name + " profile"
  );

}


/* =========================================================
   EXPORT
   ========================================================= */

function exportChat(){

  if(messages.length === 0){

    showToast("No messages to export");

    return;

  }


  const data =
    JSON.stringify(
      messages,
      null,
      2
    );


  const blob =
    new Blob(
      [data],
      {
        type:"application/json"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "chat-export.json";

  a.click();


  URL.revokeObjectURL(url);

}


/* =========================================================
   CLEAR
   ========================================================= */

function clearChat(){

  if(messages.length === 0){

    showToast("Chat is already empty");

    return;

  }


  if(
    !confirm(
      "Are you sure you want to clear the entire chat?"
    )
  ){

    return;

  }


  messages = [];

  saveMessages();

  renderMessages();

  showToast("Chat cleared");

}


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer;

function showToast(text){

  const toast =
    document.getElementById("toast");

  toast.textContent = text;

  toast.classList.add("show");


  clearTimeout(toastTimer);


  toastTimer =
    setTimeout(() => {

      toast.classList.remove("show");

    },2200);

}


/* =========================================================
   ENTER TO SEND
   ========================================================= */

document
  .getElementById("youInput")
  .addEventListener("keydown",function(event){

    if(event.key === "Enter" && !event.shiftKey){

      event.preventDefault();

      sendMessage("me");

    }

  });


document
  .getElementById("uzairInput")
  .addEventListener("keydown",function(event){

    if(event.key === "Enter" && !event.shiftKey){

      event.preventDefault();

      sendMessage("uzair");

    }

  });


document
  .getElementById("centerInput")
  .addEventListener("keydown",function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      sendMessage("me");

    }

  });


/* =========================================================
   INITIALIZE
   ========================================================= */

loadMessages();

buildEmojiPanel("youEmoji");

buildEmojiPanel("uzairEmoji");

buildEmojiPanel("centerEmoji");


if(
  localStorage.getItem("chat_dark_mode") === "1"
){

  document.body.classList.add("dark");

}


renderMessages();


/* Close emoji panels when clicking elsewhere */

document.addEventListener("click",function(event){

  if(
    !event.target.closest(".emoji-btn") &&
    !event.target.closest(".emoji-panel")
  ){

    document
      .querySelectorAll(".emoji-panel")
      .forEach(panel =>
        panel.classList.remove("show")
      );

  }

});

</script>
